name: Runtime compatibility

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
      - name: Install pinned Home Assistant and VeSync runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homeassistant==2026.8.0" "pyvesync==3.4.2"
      - name: Import custom component and test session round trip
        run: python scripts/runtime_smoke.py
