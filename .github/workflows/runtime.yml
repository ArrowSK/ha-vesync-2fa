name: Runtime compatibility

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"
      - name: Install pinned Home Assistant and VeSync runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homeassistant==2026.8.0" "pyvesync==3.4.2"
      - name: Import diagnostic component and test redaction
        run: python scripts/runtime_smoke.py
      - name: Serialize diagnostic config-flow form
        run: python scripts/schema_smoke.py
      - name: Verify HAR-confirmed MFA protocol shape
        run: python scripts/exact_flow_smoke.py
      - name: Verify read-only pyvesync session validation
        run: python scripts/session_validation_smoke.py
      - name: Verify production same-domain layer
        run: python scripts/production_smoke.py
