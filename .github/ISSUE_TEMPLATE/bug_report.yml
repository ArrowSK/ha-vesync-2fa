name: Bug report
description: Report a problem with the VeSync session bridge
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste VeSync passwords, session tokens, account IDs, device CIDs, MAC addresses or `.storage/core.config_entries`.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.8.0
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: VeSync/Levoit/Etekcity device model
  - type: dropdown
    id: stage
    attributes:
      label: When does the problem happen?
      options:
        - Initial login
        - Reauthentication
        - Home Assistant restart
        - Normal polling/control
        - HACS installation/update
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the exact behaviour you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized log or traceback
      render: text
      description: Remove credentials and unique account/device identifiers before posting.
