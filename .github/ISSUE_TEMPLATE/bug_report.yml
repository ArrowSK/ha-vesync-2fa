name: Bug report
description: Report a problem with the VeSync 2FA integration
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste VeSync passwords, one-time codes, cloud/session tokens, MFA challenge tokens (`bizToken`), authorization codes, account IDs, email addresses, device CIDs, MAC addresses, raw authentication responses, or `.storage/core.config_entries`.

        If the **VeSync two-factor challenge detected** screen is involved, copy only its **Safe metadata** line.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.8.0
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: VeSync/Levoit/Etekcity device model
  - type: dropdown
    id: stage
    attributes:
      label: When does the problem happen?
      options:
        - Initial login
        - MFA challenge detection
        - Reauthentication
        - Home Assistant restart
        - Normal polling/control
        - HACS installation/update
        - Other
    validations:
      required: true
  - type: input
    id: mfa_metadata
    attributes:
      label: Safe MFA metadata, if shown
      description: Paste only the Safe metadata line generated by the integration. Leave blank for unrelated problems.
      placeholder: server_code=...; methods=...; biz_token=yes; verify_email=yes; result_keys=...
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the exact behaviour you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized log or traceback
      render: text
      description: Remove credentials and unique account/device identifiers before posting. Do not include raw authentication request/response bodies.
