name: Bug report
description: Report a problem with the VeSync 2FA Probe
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This repository currently contains a non-invasive authentication probe, not a replacement for Home Assistant's built-in VeSync integration.

        Do not paste VeSync passwords, email addresses, one-time codes, cloud tokens, account IDs, authorization codes, `bizToken` values, device CIDs, MAC addresses, raw VeSync responses or `.storage/core.config_entries`.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.8.0
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Probe version
      placeholder: 0.3.0
    validations:
      required: true
  - type: dropdown
    id: api_region
    attributes:
      label: VeSync API region
      options:
        - EU
        - GLOBAL
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Account country code
      placeholder: HU
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: When does the problem happen?
      options:
        - Installing through HACS
        - Restarting Home Assistant
        - Opening the probe config flow
        - Sending the first-stage authentication request
        - Viewing the sanitized result
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected behaviour and what happened instead.
    validations:
      required: true
  - type: input
    id: safe_metadata
    attributes:
      label: Safe metadata line
      description: Paste only the line produced by the probe result screen, if available.
      placeholder: outcome=mfa_required; server_code=...; methods=...
  - type: textarea
    id: logs
    attributes:
      label: Sanitized log or traceback
      render: text
      description: Remove credentials and unique account/device identifiers before posting.
